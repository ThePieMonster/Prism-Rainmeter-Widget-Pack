; ==========================================================================
;  Prism Gemini API Spend - aistudio.google.com cost tracker
;  Reads from ConsumerData.inc (written by the Chrome extension).
;
;  Shows month-to-date dollar spend for the selected project (or all
;  projects aggregated). Per-project selection is managed in the Chrome
;  extension popup Settings tab.
;
;  Display states:
;    Connected=0           -> "Not connected" (visit aistudio.google.com)
;    Connected=1,HasData=0 -> tier + "No spend this period"
;    Connected=1,HasData=1 -> tier + dollar amount
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#bgBlur#

; --- Context Menu ---
ContextTitle=--- Prism: Style ---
ContextAction=[]
ContextTitle2=Minimal
ContextAction2=[!WriteKeyValue Variables CurrentStyle "Minimal" "#@#Settings.inc"][!Refresh *]
ContextTitle3=Glassmorphism
ContextAction3=[!WriteKeyValue Variables CurrentStyle "Glass" "#@#Settings.inc"][!Refresh *]
ContextTitle4=Cyberpunk
ContextAction4=[!WriteKeyValue Variables CurrentStyle "Cyberpunk" "#@#Settings.inc"][!Refresh *]
ContextTitle5=Material Design
ContextAction5=[!WriteKeyValue Variables CurrentStyle "Material" "#@#Settings.inc"][!Refresh *]
ContextTitle6=--- Theme ---
ContextAction6=[]
ContextTitle7=Dark Mode
ContextAction7=[!WriteKeyValue Variables CurrentTheme "Dark" "#@#Settings.inc"][!Refresh *]
ContextTitle8=Light Mode
ContextAction8=[!WriteKeyValue Variables CurrentTheme "Light" "#@#Settings.inc"][!Refresh *]
ContextTitle9=--- Data ---
ContextAction9=[]
ContextTitle10=Open Spend Dashboard
ContextAction10=["https://aistudio.google.com/spend"]

[Metadata]
Name=Prism Gemini API Spend
Author=Prism
Information=Month-to-date API spend from aistudio.google.com/spend.
License=MIT
Version=1.0.0

; --- Includes ---
@IncludeSettings=#@#Settings.inc
@IncludeStyle=#@#Styles\#CurrentStyle#-#CurrentTheme#.inc
@IncludeConsumer=#@#ConsumerData.inc

[Variables]
iPadding=(#bgPadding#=0?10:#bgPadding#)

; ==========================================================================
;  MEASURES
; ==========================================================================

; --- Auto-refresh every 60s so @IncludeConsumer picks up fresh data ---
[measureAutoRefresh]
Measure=Calc
Formula=([measureAutoRefresh]+1)
DynamicVariables=1
IfCondition=[measureAutoRefresh]>=60
IfTrueAction=[!Refresh]

; ==========================================================================
;  METERS
; ==========================================================================

; --- Shadows ---
[meterShadowOuter]
Meter=Shape
Shape=Rectangle 4,4,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,20 | StrokeWidth 0
Hidden=(1-#bgShadow#)

[meterShadowInner]
Meter=Shape
Shape=Rectangle 2,2,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,35 | StrokeWidth 0
Hidden=(1-#bgShadow#)

; --- Background ---
[meterBackground]
Meter=Shape
Shape=Rectangle 0,0,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color #bgColor# | Stroke Color #bgBorderColor# | StrokeWidth #bgBorderThickness#
Hidden=(1-#bgType#)

; --- Brand Dot (Gemini blue) ---
[meterBrandDot]
Meter=Shape
Shape=Ellipse (#iPadding#+3),(#iPadding#+7),3,3 | Fill Color #barGeminiColor# | StrokeWidth 0
Hidden=(1-#GeminiApiConnected#)

; --- Service Name ---
[meterServiceName]
Meter=String
X=(#iPadding#+12)
Y=(#iPadding#-2)
FontFace=#barLabelFont#
FontSize=#barLabelSize#
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=Gemini API
Hidden=(1-#GeminiApiConnected#)

; --- Period Label (top-right) ---
[meterPeriodLabel]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#-2)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=#barValueSize#
FontColor=#barValueColor#
StringStyle=Normal
StringCase=Upper
AntiAlias=1
Text=#GeminiApiPeriodLabel#
Hidden=(1-#GeminiApiConnected#)

; --- Big Dollar Amount (MTD) ---
[meterMonthTotal]
Meter=String
X=#iPadding#
Y=(#iPadding#+20)
FontFace=#barLabelFont#
FontSize=10
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=$#GeminiApiMonthTotal#
Hidden=(1-#GeminiApiConnected#)

; --- Caption ---
[meterMonthCaption]
Meter=String
X=#iPadding#
Y=(#iPadding#+36)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Month to date
Hidden=(1-#GeminiApiConnected#)

; --- Spend Cap row (label + value) - only shown if a cap is set ---
[meterCapLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+60)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Spend Cap
Hidden=(#GeminiApiConnected#=0?1:(#GeminiApiHasCap#=0?1:0))

[meterCapValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+60)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=$#GeminiApiSpendCapUsed# / $#GeminiApiSpendCap#
Hidden=(#GeminiApiConnected#=0?1:(#GeminiApiHasCap#=0?1:0))

; --- Project row (label + value) ---
[meterProjectLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+78)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Project
Hidden=(1-#GeminiApiConnected#)

[meterProjectValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+78)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
ClipString=1
W=(#barWidgetWidth#-#iPadding#-50)
AntiAlias=1
Text=#GeminiApiProjectName#
Hidden=(1-#GeminiApiConnected#)

; --- Not Connected state ---
[meterNotConnected]
Meter=String
X=(#barWidgetWidth#/2)
Y=(#barWidgetHeightConsumer#/2-6)
StringAlign=Center
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Visit aistudio.google.com
Hidden=#GeminiApiConnected#
