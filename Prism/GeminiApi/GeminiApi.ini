; ==========================================================================
;  Prism Gemini API Spend - aistudio.google.com cost tracker
;  Reads from ConsumerData.inc (written by the Chrome extension).
;
;  Shows month-to-date dollar spend for the selected project (or all
;  projects aggregated). Per-project selection is managed in the Chrome
;  extension popup Settings tab.
;
;  Display states:
;    Connected=0           -> "Visit aistudio.google.com"
;    Connected=1           -> big MTD dollar amount + "Month to date",
;                             with the Project row below
;    Connected=1,HasCap=1  -> also the "Spend Cap" row (used / cap)
;    Connected=1,Stale=1   -> also a "cached" note right of "Month to date"
;    Connected=1, reading older than iStaleAfter -> the note says
;                             "updated N ago" instead (Stale or not)
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#bgBlur#

; --- Context Menu ---
ContextTitle=--- Prism: Style ---
ContextAction=[]
ContextTitle2=Minimal
ContextAction2=[!WriteKeyValue Variables CurrentStyle "Minimal" "#@#Settings.inc"][!Refresh *]
ContextTitle3=Glassmorphism
ContextAction3=[!WriteKeyValue Variables CurrentStyle "Glass" "#@#Settings.inc"][!Refresh *]
ContextTitle4=Cyberpunk
ContextAction4=[!WriteKeyValue Variables CurrentStyle "Cyberpunk" "#@#Settings.inc"][!Refresh *]
ContextTitle5=Material Design
ContextAction5=[!WriteKeyValue Variables CurrentStyle "Material" "#@#Settings.inc"][!Refresh *]
ContextTitle6=--- Theme ---
ContextAction6=[]
ContextTitle7=Dark Mode
ContextAction7=[!WriteKeyValue Variables CurrentTheme "Dark" "#@#Settings.inc"][!Refresh *]
ContextTitle8=Light Mode
ContextAction8=[!WriteKeyValue Variables CurrentTheme "Light" "#@#Settings.inc"][!Refresh *]
ContextTitle9=--- Data ---
ContextAction9=[]
ContextTitle10=Open Spend Dashboard
ContextAction10=["https://aistudio.google.com/spend"]

[Metadata]
Name=Prism Gemini API Spend
Author=Prism
Information=Month-to-date API spend from aistudio.google.com/spend.
License=GPL v3
Version=1.0.0

; --- Includes ---
@IncludeSettings=#@#Settings.inc
@IncludeStyle=#@#Styles\#CurrentStyle#-#CurrentTheme#.inc
; Defaults must come first so the live values in ConsumerData.inc win.
@IncludeConsumerDefaults=#@#ConsumerDefaults.inc
@IncludeConsumer=#@#ConsumerData.inc

[Variables]
iPadding=(#bgPadding#=0?10:#bgPadding#)
; A reading older than this many seconds gets an "updated N ago" note.
; Gemini API spend is only read while aistudio.google.com/spend is open
; (about every 5 minutes), and spend totals move slowly, so the API
; widgets allow an hour (the consumer widgets 10 minutes).
iStaleAfter=3600

; ==========================================================================
;  MEASURES
; ==========================================================================

; --- Auto-refresh every 60s so @IncludeConsumer picks up fresh data ---
[measureAutoRefresh]
Measure=Calc
Formula=([measureAutoRefresh]+1)
DynamicVariables=1
IfCondition=[measureAutoRefresh]>=60
IfTrueAction=[!Refresh]

; --- Data age ---
; When the values shown were read: CachedAtEpoch, the time of the last
; /spend scrape, else ConsumerLastUpdatedEpoch, when the extension sent the
; data (both Unix seconds). The current UTC time comes from a Time measure,
; which counts seconds since 1601-01-01: 11644473600 more than Unix time.
[measureNowUtc]
Measure=Time
TimeZone=0
DaylightSavingTime=0

[measureDataEpoch]
Measure=Calc
Formula=((#GeminiApiCachedAtEpoch#+0)>0 ? (#GeminiApiCachedAtEpoch#+0) : (#ConsumerLastUpdatedEpoch#+0))

; Seconds since the values were read. 0 while the epoch is 0 or empty (no
; data yet, or a host that never wrote it), so that never looks stale.
[measureDataAge]
Measure=Calc
Formula=(measureDataEpoch>0 ? Max(measureNowUtc-11644473600-measureDataEpoch,0) : 0)

; 1 while connected and the reading is older than iStaleAfter
[measureDataOld]
Measure=Calc
Formula=(#GeminiApiConnected#*(measureDataAge>#iStaleAfter#))

; The age in whole minutes, hours or days for the note, which says
; "cached" while the reading is not older than iStaleAfter
[measureDataAgeShown]
Measure=Calc
Formula=(measureDataAge<3600 ? Floor(measureDataAge/60) : (measureDataAge<86400 ? Floor(measureDataAge/3600) : Floor(measureDataAge/86400)))
IfCondition=measureDataOld=0
IfTrueAction=[!SetOption meterStaleNote Text "cached"]
IfCondition2=(measureDataOld=1)&&(measureDataAge<3600)
IfTrueAction2=[!SetOption meterStaleNote Text "updated %1m ago"]
IfCondition3=(measureDataOld=1)&&(measureDataAge>=3600)&&(measureDataAge<86400)
IfTrueAction3=[!SetOption meterStaleNote Text "updated %1h ago"]
IfCondition4=(measureDataOld=1)&&(measureDataAge>=86400)
IfTrueAction4=[!SetOption meterStaleNote Text "updated %1d ago"]

; ==========================================================================
;  METERS
; ==========================================================================

; --- Shadows ---
[meterShadowOuter]
Meter=Shape
Shape=Rectangle 4,4,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,20 | StrokeWidth 0
Hidden=(1-#bgShadow#)

[meterShadowInner]
Meter=Shape
Shape=Rectangle 2,2,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,35 | StrokeWidth 0
Hidden=(1-#bgShadow#)

; --- Background ---
[meterBackground]
Meter=Shape
Shape=Rectangle 0,0,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color #bgColor# | Stroke Color #bgBorderColor# | StrokeWidth #bgBorderThickness#
Hidden=(1-#bgType#)

; --- Brand Dot (Gemini blue) ---
[meterBrandDot]
Meter=Shape
Shape=Ellipse (#iPadding#+3),(#iPadding#+7),3,3 | Fill Color #barGeminiColor# | StrokeWidth 0
Hidden=(1-#GeminiApiConnected#)

; --- Service Name ---
[meterServiceName]
Meter=String
X=(#iPadding#+12)
Y=(#iPadding#-2)
FontFace=#barLabelFont#
FontSize=#barLabelSize#
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=Gemini API
Hidden=(1-#GeminiApiConnected#)

; --- Period Label (top-right) ---
[meterPeriodLabel]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#-2)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=#barValueSize#
FontColor=#barValueColor#
StringStyle=Normal
StringCase=Upper
AntiAlias=1
Text=#GeminiApiPeriodLabel#
Hidden=(1-#GeminiApiConnected#)

; --- Big Dollar Amount (MTD) ---
[meterMonthTotal]
Meter=String
X=#iPadding#
Y=(#iPadding#+20)
FontFace=#barLabelFont#
FontSize=10
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=$#GeminiApiMonthTotal#
Hidden=(1-#GeminiApiConnected#)

; --- Caption ---
[meterMonthCaption]
Meter=String
X=#iPadding#
Y=(#iPadding#+36)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Month to date
Hidden=(1-#GeminiApiConnected#)

; --- Cached / "updated N ago" note (right of the caption) ---
; Shown while Stale=1 or measureDataOld=1. Stale=1: the last /spend scrape
; could not read every project, so the total holds a value kept from an
; earlier scrape (or leaves one out).
[meterStaleNote]
Meter=String
MeasureName=measureDataAgeShown
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+36)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=8
FontColor=#barStaleColor#
StringStyle=Normal
AntiAlias=1
NumOfDecimals=0
Text=cached
DynamicVariables=1
Hidden=(((#GeminiApiConnected#*(#GeminiApiStale#+0))+[measureDataOld])>0?0:1)

; --- Spend Cap row (label + value) - only shown if a cap is set ---
[meterCapLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+60)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Spend Cap
Hidden=(#GeminiApiConnected#=0?1:(#GeminiApiHasCap#=0?1:0))

[meterCapValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+60)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=$#GeminiApiSpendCapUsed# / $#GeminiApiSpendCap#
Hidden=(#GeminiApiConnected#=0?1:(#GeminiApiHasCap#=0?1:0))

; --- Project row (label + value) ---
[meterProjectLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+78)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Project
Hidden=(1-#GeminiApiConnected#)

[meterProjectValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+78)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
ClipString=1
; Clip box starts 2px right of the "Project" label so long names never overlap it.
W=(#barWidgetWidth#-(#iPadding#*2)-[meterProjectLabel:W]-2)
DynamicVariables=1
AntiAlias=1
Text=#GeminiApiProjectName#
Hidden=(1-#GeminiApiConnected#)

; --- Not Connected state ---
[meterNotConnected]
Meter=String
X=(#barWidgetWidth#/2)
Y=(#barWidgetHeightConsumer#/2-6)
StringAlign=Center
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Visit aistudio.google.com
Hidden=#GeminiApiConnected#
