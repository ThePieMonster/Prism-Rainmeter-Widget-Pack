; ==========================================================================
;  Prism ChatGPT Consumer Usage - Consumer plan bars (session + weekly)
;  Reads from ConsumerData.inc (chatgpt.com usage limits via the extension).
;  3 display states:
;    Connected=0             -> "Not connected"
;    Connected=1, HasData=0  -> "{PlanName}" (plan status only, no bars)
;    Connected=1, HasData=1  -> session (5-hour) + weekly usage bars
;
;  These are the Codex usage limits ChatGPT shows under "Usage remaining"
;  in its profile menu: "Session" is the 5-hour rolling window, "Weekly"
;  is the 7-day cap - same model as the Claude and Gemini widgets.
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#bgBlur#

; --- Context Menu ---
ContextTitle=--- Prism: Style ---
ContextAction=[]
ContextTitle2=Minimal
ContextAction2=[!WriteKeyValue Variables CurrentStyle "Minimal" "#@#Settings.inc"][!Refresh *]
ContextTitle3=Glassmorphism
ContextAction3=[!WriteKeyValue Variables CurrentStyle "Glass" "#@#Settings.inc"][!Refresh *]
ContextTitle4=Cyberpunk
ContextAction4=[!WriteKeyValue Variables CurrentStyle "Cyberpunk" "#@#Settings.inc"][!Refresh *]
ContextTitle5=Material Design
ContextAction5=[!WriteKeyValue Variables CurrentStyle "Material" "#@#Settings.inc"][!Refresh *]
ContextTitle6=--- Theme ---
ContextAction6=[]
ContextTitle7=Dark Mode
ContextAction7=[!WriteKeyValue Variables CurrentTheme "Dark" "#@#Settings.inc"][!Refresh *]
ContextTitle8=Light Mode
ContextAction8=[!WriteKeyValue Variables CurrentTheme "Light" "#@#Settings.inc"][!Refresh *]

[Metadata]
Name=Prism ChatGPT Consumer Usage
Author=Prism
Information=Codex usage limit bars for your ChatGPT plan (session + weekly).
License=MIT
Version=1.3.0

@IncludeSettings=#@#Settings.inc
@IncludeStyle=#@#Styles\#CurrentStyle#-#CurrentTheme#.inc
@IncludeConsumer=#@#ConsumerData.inc

[Variables]
iPadding=(#bgPadding#=0?10:#bgPadding#)
iBarWidth=(#barWidgetWidth#-(#iPadding#*2))
iRow2Y=(#iPadding#+72)
; Tall (two bars) when usage data is available, compact otherwise.
iWidgetHeight=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?#barWidgetHeightConsumer#:#barWidgetHeightCompact#)

; ==========================================================================
;  MEASURES
; ==========================================================================

[measureSessionPercent]
Measure=Calc
Formula=#ChatGPTSessionPercent#
MinValue=0
MaxValue=100

[measureWeeklyPercent]
Measure=Calc
Formula=#ChatGPTWeeklyPercent#
MinValue=0
MaxValue=100

; --- Auto-refresh every 60s so @IncludeConsumer picks up fresh data ---
[measureAutoRefresh]
Measure=Calc
Formula=([measureAutoRefresh]+1)
DynamicVariables=1
IfCondition=[measureAutoRefresh]>=60
IfTrueAction=[!Refresh]

; ==========================================================================
;  METERS - shared (background + header)
; ==========================================================================

[meterShadowOuter]
Meter=Shape
Shape=Rectangle 4,4,#barWidgetWidth#,#iWidgetHeight#,#bgCornerRadius# | Fill Color 0,0,0,20 | StrokeWidth 0
DynamicVariables=1
Hidden=(1-#bgShadow#)

[meterShadowInner]
Meter=Shape
Shape=Rectangle 2,2,#barWidgetWidth#,#iWidgetHeight#,#bgCornerRadius# | Fill Color 0,0,0,35 | StrokeWidth 0
DynamicVariables=1
Hidden=(1-#bgShadow#)

[meterBackground]
Meter=Shape
Shape=Rectangle 0,0,#barWidgetWidth#,#iWidgetHeight#,#bgCornerRadius# | Fill Color #bgColor# | Stroke Color #bgBorderColor# | StrokeWidth #bgBorderThickness#
DynamicVariables=1
Hidden=(1-#bgType#)

[meterBrandDot]
Meter=Shape
Shape=Ellipse (#iPadding#+3),(#iPadding#+7),3,3 | Fill Color #barChatGPTColor# | StrokeWidth 0
Hidden=(1-#ChatGPTConsumerConnected#)

[meterServiceName]
Meter=String
X=(#iPadding#+12)
Y=(#iPadding#-2)
FontFace=#barLabelFont#
FontSize=#barLabelSize#
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=ChatGPT
Hidden=(1-#ChatGPTConsumerConnected#)

; --- Plan Name (top-right) - shown whenever connected ---
[meterPlanName]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#-2)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=#barValueSize#
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#ChatGPTPlanName#
Hidden=(1-#ChatGPTConsumerConnected#)

; ==========================================================================
;  STATE A: Usage bars (Connected=1, HasData=1)
; ==========================================================================

; ===== ROW 1: Session (5-hour) =====

[meterSessionLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+22)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Session
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?0:1)

[meterSessionValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+22)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#ChatGPTSessionPercent#% used
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?0:1)

[meterSessionReset]
Meter=String
X=#iPadding#
Y=(#iPadding#+36)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#ChatGPTSessionReset#
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?0:1)

[meterSessionTrack]
Meter=Shape
Shape=Rectangle #iPadding#,(#iPadding#+54),#iBarWidth#,#barHeight#,#barCornerRadius# | Fill Color #barTrackColor# | StrokeWidth 0
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?0:1)

[meterSessionFill]
Meter=Shape
Shape=Rectangle #iPadding#,(#iPadding#+54),(#iBarWidth#*[measureSessionPercent]/100),#barHeight#,#barCornerRadius# | Fill Color #barFillColor# | StrokeWidth 0
DynamicVariables=1
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=0?1:([measureSessionPercent]=0?1:0))

; ===== ROW 2: Weekly =====

[meterWeeklyLabel]
Meter=String
X=#iPadding#
Y=#iRow2Y#
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Weekly
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?0:1)

[meterWeeklyValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=#iRow2Y#
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#ChatGPTWeeklyPercent#% used
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?0:1)

[meterWeeklyReset]
Meter=String
X=#iPadding#
Y=(#iRow2Y#+14)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#ChatGPTWeeklyReset#
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?0:1)

[meterWeeklyTrack]
Meter=Shape
Shape=Rectangle #iPadding#,(#iRow2Y#+32),#iBarWidth#,#barHeight#,#barCornerRadius# | Fill Color #barTrackColor# | StrokeWidth 0
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=1?0:1)

[meterWeeklyFill]
Meter=Shape
Shape=Rectangle #iPadding#,(#iRow2Y#+32),(#iBarWidth#*[measureWeeklyPercent]/100),#barHeight#,#barCornerRadius# | Fill Color #barFillColor# | StrokeWidth 0
DynamicVariables=1
Hidden=((#ChatGPTConsumerConnected#*#ChatGPTHasUsageData#)=0?1:([measureWeeklyPercent]=0?1:0))

; ==========================================================================
;  STATE B: Plan status only (Connected=1, HasData=0)
; ==========================================================================

[meterActiveLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+28)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Active - no usage data available
Hidden=((#ChatGPTConsumerConnected#*(1-#ChatGPTHasUsageData#))=1?0:1)

; ==========================================================================
;  STATE C: Not connected (Connected=0)
; ==========================================================================

[meterNotConnected]
Meter=String
X=(#barWidgetWidth#/2)
Y=(#barWidgetHeightCompact#/2-6)
StringAlign=Center
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Not connected
Hidden=#ChatGPTConsumerConnected#
