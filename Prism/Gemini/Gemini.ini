; ==========================================================================
;  Prism Gemini Consumer Usage
;  3 display states:
;    Connected=0             -> "Not connected"
;    Connected=1, HasData=0  -> "{PlanName}" (plan status only, no bar)
;    Connected=1, HasData=1  -> full usage bar with percentage
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#bgBlur#

; --- Context Menu ---
ContextTitle=--- Prism: Style ---
ContextAction=[]
ContextTitle2=Minimal
ContextAction2=[!WriteKeyValue Variables CurrentStyle "Minimal" "#@#Settings.inc"][!Refresh *]
ContextTitle3=Glassmorphism
ContextAction3=[!WriteKeyValue Variables CurrentStyle "Glass" "#@#Settings.inc"][!Refresh *]
ContextTitle4=Cyberpunk
ContextAction4=[!WriteKeyValue Variables CurrentStyle "Cyberpunk" "#@#Settings.inc"][!Refresh *]
ContextTitle5=Material Design
ContextAction5=[!WriteKeyValue Variables CurrentStyle "Material" "#@#Settings.inc"][!Refresh *]
ContextTitle6=--- Theme ---
ContextAction6=[]
ContextTitle7=Dark Mode
ContextAction7=[!WriteKeyValue Variables CurrentTheme "Dark" "#@#Settings.inc"][!Refresh *]
ContextTitle8=Light Mode
ContextAction8=[!WriteKeyValue Variables CurrentTheme "Light" "#@#Settings.inc"][!Refresh *]

[Metadata]
Name=Prism Gemini Consumer Usage
Author=Prism
Information=Consumer plan status for Gemini.
License=MIT
Version=1.2.0

@IncludeSettings=#@#Settings.inc
@IncludeStyle=#@#Styles\#CurrentStyle#-#CurrentTheme#.inc
@IncludeConsumer=#@#ConsumerData.inc

[Variables]
iPadding=(#bgPadding#=0?10:#bgPadding#)
iBarWidth=(#barWidgetWidth#-(#iPadding#*2))

; ==========================================================================
;  MEASURES
; ==========================================================================

[measureDailyPercent]
Measure=Calc
Formula=#GeminiDailyPercent#
MinValue=0
MaxValue=100

; --- Auto-refresh every 60s so @IncludeConsumer picks up fresh data ---
[measureAutoRefresh]
Measure=Calc
Formula=([measureAutoRefresh]+1)
DynamicVariables=1
IfCondition=[measureAutoRefresh]>=60
IfTrueAction=[!Refresh]

; ==========================================================================
;  METERS - shared
; ==========================================================================

[meterShadowOuter]
Meter=Shape
Shape=Rectangle 4,4,#barWidgetWidth#,#barWidgetHeightCompact#,#bgCornerRadius# | Fill Color 0,0,0,20 | StrokeWidth 0
Hidden=(1-#bgShadow#)

[meterShadowInner]
Meter=Shape
Shape=Rectangle 2,2,#barWidgetWidth#,#barWidgetHeightCompact#,#bgCornerRadius# | Fill Color 0,0,0,35 | StrokeWidth 0
Hidden=(1-#bgShadow#)

[meterBackground]
Meter=Shape
Shape=Rectangle 0,0,#barWidgetWidth#,#barWidgetHeightCompact#,#bgCornerRadius# | Fill Color #bgColor# | Stroke Color #bgBorderColor# | StrokeWidth #bgBorderThickness#
Hidden=(1-#bgType#)

[meterBrandDot]
Meter=Shape
Shape=Ellipse (#iPadding#+3),(#iPadding#+7),3,3 | Fill Color #barGeminiColor# | StrokeWidth 0
Hidden=(1-#GeminiConsumerConnected#)

[meterServiceName]
Meter=String
X=(#iPadding#+12)
Y=(#iPadding#-2)
FontFace=#barLabelFont#
FontSize=#barLabelSize#
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=Gemini
Hidden=(1-#GeminiConsumerConnected#)

; ==========================================================================
;  STATE A: Full usage bar
; ==========================================================================

[meterValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#-2)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=#barValueSize#
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#GeminiDailyPercent#% used
Hidden=((#GeminiConsumerConnected#*#GeminiHasUsageData#)=1?0:1)

[meterResetInfo]
Meter=String
X=#iPadding#
Y=(#iPadding#+18)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#GeminiDailyReset#
Hidden=((#GeminiConsumerConnected#*#GeminiHasUsageData#)=1?0:1)

[meterBarTrack]
Meter=Shape
Shape=Rectangle #iPadding#,(#iPadding#+36),#iBarWidth#,#barHeight#,#barCornerRadius# | Fill Color #barTrackColor# | StrokeWidth 0
Hidden=((#GeminiConsumerConnected#*#GeminiHasUsageData#)=1?0:1)

[meterBarFill]
Meter=Shape
Shape=Rectangle #iPadding#,(#iPadding#+36),(#iBarWidth#*[measureDailyPercent]/100),#barHeight#,#barCornerRadius# | Fill Color #barFillColor# | StrokeWidth 0
DynamicVariables=1
Hidden=((#GeminiConsumerConnected#*#GeminiHasUsageData#)=1?([measureDailyPercent]=0?1:0):1)

; ==========================================================================
;  STATE B: Plan status only
; ==========================================================================

[meterPlanName]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#-2)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=#barValueSize#
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#GeminiPlanName#
Hidden=((#GeminiConsumerConnected#*(1-#GeminiHasUsageData#))=1?0:1)

[meterActiveLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+28)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Active - no usage data available
Hidden=((#GeminiConsumerConnected#*(1-#GeminiHasUsageData#))=1?0:1)

; ==========================================================================
;  STATE C: Not connected
; ==========================================================================

[meterNotConnected]
Meter=String
X=(#barWidgetWidth#/2)
Y=(#barWidgetHeightCompact#/2-6)
StringAlign=Center
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Not connected
Hidden=#GeminiConsumerConnected#
