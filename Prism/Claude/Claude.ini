; ==========================================================================
;  Prism Claude Consumer Usage - Consumer plan bars (session + weekly)
;  Reads from ConsumerData.inc (web-scraped data).
;  Display states:
;    Connected=0            -> "Not connected"
;    Connected=1            -> session (5-hour) + weekly usage bars
;    Connected=1, data old  -> same, with dimmed bars and an "updated N ago"
;                              note (no update for iStaleAfter seconds)
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#bgBlur#

; --- Context Menu ---
ContextTitle=--- Prism: Style ---
ContextAction=[]
ContextTitle2=Minimal
ContextAction2=[!WriteKeyValue Variables CurrentStyle "Minimal" "#@#Settings.inc"][!Refresh *]
ContextTitle3=Glassmorphism
ContextAction3=[!WriteKeyValue Variables CurrentStyle "Glass" "#@#Settings.inc"][!Refresh *]
ContextTitle4=Cyberpunk
ContextAction4=[!WriteKeyValue Variables CurrentStyle "Cyberpunk" "#@#Settings.inc"][!Refresh *]
ContextTitle5=Material Design
ContextAction5=[!WriteKeyValue Variables CurrentStyle "Material" "#@#Settings.inc"][!Refresh *]
ContextTitle6=--- Theme ---
ContextAction6=[]
ContextTitle7=Dark Mode
ContextAction7=[!WriteKeyValue Variables CurrentTheme "Dark" "#@#Settings.inc"][!Refresh *]
ContextTitle8=Light Mode
ContextAction8=[!WriteKeyValue Variables CurrentTheme "Light" "#@#Settings.inc"][!Refresh *]
ContextTitle9=--- Data ---
ContextAction9=[]
ContextTitle10=Open Usage Page
ContextAction10=["https://claude.ai/settings/usage"]

[Metadata]
Name=Prism Claude Consumer Usage
Author=Prism
Information=Consumer plan usage bars for Claude (session + weekly).
License=GPL v3
Version=1.1.0

; --- Includes ---
@IncludeSettings=#@#Settings.inc
@IncludeStyle=#@#Styles\#CurrentStyle#-#CurrentTheme#.inc
; Defaults must come first so the live values in ConsumerData.inc win.
@IncludeConsumerDefaults=#@#ConsumerDefaults.inc
@IncludeConsumer=#@#ConsumerData.inc

[Variables]
iPadding=(#bgPadding#=0?10:#bgPadding#)
iBarWidth=(#barWidgetWidth#-(#iPadding#*2))
iRow2Y=(#iPadding#+72)
; Data older than this many seconds counts as stale. The extension sends
; every minute while the browser runs, so 10 minutes without an update
; means updates have stopped (browser closed, extension off, PC asleep).
iStaleAfter=600
; Bar fill color, switched to #barStaleFillColor# while the data is stale
iFillColor=#barFillColor#

; ==========================================================================
;  MEASURES
; ==========================================================================

; Bar fill: Clamp() keeps it inside the track (MinValue/MaxValue alone do
; not limit the value a formula reads).
[measureSessionPercent]
Measure=Calc
Formula=Clamp(#ClaudeSessionPercent#,0,100)
MinValue=0
MaxValue=100

[measureWeeklyPercent]
Measure=Calc
Formula=Clamp(#ClaudeWeeklyPercent#,0,100)
MinValue=0
MaxValue=100

; "% used" text: rounded but not clamped, so an over-limit reading still shows.
[measureSessionText]
Measure=Calc
Formula=Round(#ClaudeSessionPercent#)

[measureWeeklyText]
Measure=Calc
Formula=Round(#ClaudeWeeklyPercent#)

; --- Auto-refresh every 60s so @IncludeConsumer picks up fresh data ---
[measureAutoRefresh]
Measure=Calc
Formula=([measureAutoRefresh]+1)
DynamicVariables=1
IfCondition=[measureAutoRefresh]>=60
IfTrueAction=[!Refresh]

; --- Data age ---
; ConsumerLastUpdatedEpoch is when the extension collected the data (Unix
; seconds). The current UTC time comes from a Time measure, which counts
; seconds since 1601-01-01: 11644473600 more than Unix time.
[measureNowUtc]
Measure=Time
TimeZone=0
DaylightSavingTime=0

; Seconds since the data was collected. 0 while the epoch is 0 or empty
; (no data yet, or a host that never wrote it), so that never looks stale.
[measureDataAge]
Measure=Calc
Formula=((#ConsumerLastUpdatedEpoch#+0)>0 ? Max(measureNowUtc-11644473600-(#ConsumerLastUpdatedEpoch#+0),0) : 0)

; 1 while connected and the data is older than iStaleAfter: the bars dim
; and the "updated N ago" note shows. Checked every second, so the widget
; turns stale on its own when updates stop.
[measureDataOld]
Measure=Calc
Formula=(#ClaudeConsumerConnected#*(measureDataAge>#iStaleAfter#))
IfCondition=measureDataOld=1
IfTrueAction=[!SetVariable iFillColor "#barStaleFillColor#"]
IfFalseAction=[!SetVariable iFillColor "#barFillColor#"]

; The age in whole minutes, hours or days, with the note's unit to match
[measureDataAgeShown]
Measure=Calc
Formula=(measureDataAge<3600 ? Floor(measureDataAge/60) : (measureDataAge<86400 ? Floor(measureDataAge/3600) : Floor(measureDataAge/86400)))
IfCondition=measureDataAge<3600
IfTrueAction=[!SetOption meterDataAge Text "updated %1m ago"]
IfCondition2=(measureDataAge>=3600)&&(measureDataAge<86400)
IfTrueAction2=[!SetOption meterDataAge Text "updated %1h ago"]
IfCondition3=measureDataAge>=86400
IfTrueAction3=[!SetOption meterDataAge Text "updated %1d ago"]

; ==========================================================================
;  METERS
; ==========================================================================

; --- Shadows ---
[meterShadowOuter]
Meter=Shape
Shape=Rectangle 4,4,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,20 | StrokeWidth 0
Hidden=(1-#bgShadow#)

[meterShadowInner]
Meter=Shape
Shape=Rectangle 2,2,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,35 | StrokeWidth 0
Hidden=(1-#bgShadow#)

; --- Background ---
[meterBackground]
Meter=Shape
Shape=Rectangle 0,0,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color #bgColor# | Stroke Color #bgBorderColor# | StrokeWidth #bgBorderThickness#
Hidden=(1-#bgType#)

; --- Brand Dot ---
[meterBrandDot]
Meter=Shape
Shape=Ellipse (#iPadding#+3),(#iPadding#+7),3,3 | Fill Color #barClaudeColor# | StrokeWidth 0
Hidden=(1-#ClaudeConsumerConnected#)

; --- Service Name ---
[meterServiceName]
Meter=String
X=(#iPadding#+12)
Y=(#iPadding#-2)
FontFace=#barLabelFont#
FontSize=#barLabelSize#
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=Claude
Hidden=(1-#ClaudeConsumerConnected#)

; --- Plan Name (top-right) ---
[meterPlanName]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#-2)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=#barValueSize#
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#ClaudePlanName#
Hidden=(1-#ClaudeConsumerConnected#)

; ===== ROW 1: Session =====

[meterSessionLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+22)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Session
Hidden=(1-#ClaudeConsumerConnected#)

[meterSessionValue]
Meter=String
MeasureName=measureSessionText
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+22)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
NumOfDecimals=0
Text=%1% used
Hidden=(1-#ClaudeConsumerConnected#)

[meterSessionReset]
Meter=String
X=#iPadding#
Y=(#iPadding#+36)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#ClaudeSessionReset#
Hidden=(1-#ClaudeConsumerConnected#)

[meterSessionTrack]
Meter=Shape
Shape=Rectangle #iPadding#,(#iPadding#+54),#iBarWidth#,#barHeight#,#barCornerRadius# | Fill Color #barTrackColor# | StrokeWidth 0
Hidden=(1-#ClaudeConsumerConnected#)

[meterSessionFill]
Meter=Shape
Shape=Rectangle #iPadding#,(#iPadding#+54),(#iBarWidth#*[measureSessionPercent]/100),#barHeight#,#barCornerRadius# | Fill Color #iFillColor# | StrokeWidth 0
DynamicVariables=1
Hidden=(#ClaudeConsumerConnected#=0?1:([measureSessionPercent]=0?1:0))

; ===== ROW 2: Weekly =====

[meterWeeklyLabel]
Meter=String
X=#iPadding#
Y=#iRow2Y#
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Weekly
Hidden=(1-#ClaudeConsumerConnected#)

[meterWeeklyValue]
Meter=String
MeasureName=measureWeeklyText
X=(#barWidgetWidth#-#iPadding#)
Y=#iRow2Y#
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
NumOfDecimals=0
Text=%1% used
Hidden=(1-#ClaudeConsumerConnected#)

[meterWeeklyReset]
Meter=String
X=#iPadding#
Y=(#iRow2Y#+14)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=#ClaudeWeeklyReset#
Hidden=(1-#ClaudeConsumerConnected#)

[meterWeeklyTrack]
Meter=Shape
Shape=Rectangle #iPadding#,(#iRow2Y#+32),#iBarWidth#,#barHeight#,#barCornerRadius# | Fill Color #barTrackColor# | StrokeWidth 0
Hidden=(1-#ClaudeConsumerConnected#)

[meterWeeklyFill]
Meter=Shape
Shape=Rectangle #iPadding#,(#iRow2Y#+32),(#iBarWidth#*[measureWeeklyPercent]/100),#barHeight#,#barCornerRadius# | Fill Color #iFillColor# | StrokeWidth 0
DynamicVariables=1
Hidden=(#ClaudeConsumerConnected#=0?1:([measureWeeklyPercent]=0?1:0))

; --- Stale note (below the weekly bar) - only while measureDataOld=1 ---
[meterDataAge]
Meter=String
MeasureName=measureDataAgeShown
X=(#barWidgetWidth#-#iPadding#)
Y=(#iRow2Y#+36+#barHeight#)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=8
FontColor=#barStaleColor#
StringStyle=Normal
AntiAlias=1
NumOfDecimals=0
Text=updated %1m ago
DynamicVariables=1
Hidden=([measureDataOld]=1?0:1)

; --- Not Connected ---
[meterNotConnected]
Meter=String
X=(#barWidgetWidth#/2)
Y=(#barWidgetHeightConsumer#/2-6)
StringAlign=Center
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Not connected
Hidden=#ClaudeConsumerConnected#
