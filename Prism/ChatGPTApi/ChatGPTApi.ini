; ==========================================================================
;  Prism ChatGPT API Cost - platform.openai.com spend tracker
;  Reads from ConsumerData.inc (written by the Chrome extension).
;
;  Display states:
;    Connected=0  -> "Visit platform.openai.com" (sign in there to initialize)
;    Connected=1  -> Big MTD total, with Today + Yesterday breakdown
;    Connected=1,Stale=1 -> same, from a snapshot taken on an earlier UTC
;                 day: a "cached" note, and the rows read "Last sync day" /
;                 "Day before"
;    Connected=1, no update since the reading's UTC day ended -> same
;    Connected=1, reading older than iStaleAfter -> the note says
;                 "updated N ago" instead of "cached"
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#bgBlur#

; --- Context Menu ---
ContextTitle=--- Prism: Style ---
ContextAction=[]
ContextTitle2=Minimal
ContextAction2=[!WriteKeyValue Variables CurrentStyle "Minimal" "#@#Settings.inc"][!Refresh *]
ContextTitle3=Glassmorphism
ContextAction3=[!WriteKeyValue Variables CurrentStyle "Glass" "#@#Settings.inc"][!Refresh *]
ContextTitle4=Cyberpunk
ContextAction4=[!WriteKeyValue Variables CurrentStyle "Cyberpunk" "#@#Settings.inc"][!Refresh *]
ContextTitle5=Material Design
ContextAction5=[!WriteKeyValue Variables CurrentStyle "Material" "#@#Settings.inc"][!Refresh *]
ContextTitle6=--- Theme ---
ContextAction6=[]
ContextTitle7=Dark Mode
ContextAction7=[!WriteKeyValue Variables CurrentTheme "Dark" "#@#Settings.inc"][!Refresh *]
ContextTitle8=Light Mode
ContextAction8=[!WriteKeyValue Variables CurrentTheme "Light" "#@#Settings.inc"][!Refresh *]
ContextTitle9=--- Data ---
ContextAction9=[]
ContextTitle10=Open Cost Dashboard
ContextAction10=["https://platform.openai.com/settings/organization/usage"]

[Metadata]
Name=Prism ChatGPT API Cost
Author=Prism
Information=Month-to-date API spend from platform.openai.com.
License=GPL v3
Version=1.0.0

; --- Includes ---
@IncludeSettings=#@#Settings.inc
@IncludeStyle=#@#Styles\#CurrentStyle#-#CurrentTheme#.inc
; Defaults must come first so the live values in ConsumerData.inc win.
@IncludeConsumerDefaults=#@#ConsumerDefaults.inc
@IncludeConsumer=#@#ConsumerData.inc

[Variables]
iPadding=(#bgPadding#=0?10:#bgPadding#)
; A reading older than this many seconds gets an "updated N ago" note.
; ChatGPT API spend is only read while platform.openai.com is open (about
; every 5 minutes), and spend totals move slowly, so the API widgets allow
; an hour (the consumer widgets 10 minutes).
iStaleAfter=3600

; ==========================================================================
;  MEASURES
; ==========================================================================

; --- Auto-refresh every 60s so @IncludeConsumer picks up fresh data ---
[measureAutoRefresh]
Measure=Calc
Formula=([measureAutoRefresh]+1)
DynamicVariables=1
IfCondition=[measureAutoRefresh]>=60
IfTrueAction=[!Refresh]

; --- Data age ---
; When the values shown were read: CachedAtEpoch for a cached reading (0
; for a live one), else ConsumerLastUpdatedEpoch, when the extension sent
; the data (both Unix seconds). The current UTC time comes from a Time
; measure, which counts seconds since 1601-01-01: 11644473600 more than
; Unix time.
[measureNowUtc]
Measure=Time
TimeZone=0
DaylightSavingTime=0

[measureDataEpoch]
Measure=Calc
Formula=((#ChatGPTApiCachedAtEpoch#+0)>0 ? (#ChatGPTApiCachedAtEpoch#+0) : (#ConsumerLastUpdatedEpoch#+0))

; Seconds since the values were read. 0 while the epoch is 0 or empty (no
; data yet, or a host that never wrote it), so that never looks stale.
[measureDataAge]
Measure=Calc
Formula=(measureDataEpoch>0 ? Max(measureNowUtc-11644473600-measureDataEpoch,0) : 0)

; 1 while connected and the reading is older than iStaleAfter
[measureDataOld]
Measure=Calc
Formula=(#ChatGPTApiConnected#*(measureDataAge>#iStaleAfter#))

; --- Stale: not a read of today's totals ---
; The cached snapshot only refreshes while a platform.openai.com tab is
; open. It was taken on an earlier UTC day (Stale=1), or the UTC day it was
; taken on has ended with no update since. Today/Yesterday are then the
; totals for the day it was taken on and the day before, not today's, so
; the rows are re-labeled (and the note below is shown).
[measureStale]
Measure=Calc
Formula=(#ChatGPTApiConnected#*(((#ChatGPTApiStale#+0)=1)||((measureDataEpoch>0)&&(Floor(measureDataEpoch/86400)<Floor((measureNowUtc-11644473600)/86400)))))
IfCondition=measureStale=1
IfTrueAction=[!SetOption meterTodayLabel Text "Last sync day"][!SetOption meterYesterdayLabel Text "Day before"]

; The age in whole minutes, hours or days for the note, which says
; "cached" while the reading is not older than iStaleAfter
[measureDataAgeShown]
Measure=Calc
Formula=(measureDataAge<3600 ? Floor(measureDataAge/60) : (measureDataAge<86400 ? Floor(measureDataAge/3600) : Floor(measureDataAge/86400)))
IfCondition=measureDataOld=0
IfTrueAction=[!SetOption meterStaleNote Text "cached"]
IfCondition2=(measureDataOld=1)&&(measureDataAge<3600)
IfTrueAction2=[!SetOption meterStaleNote Text "updated %1m ago"]
IfCondition3=(measureDataOld=1)&&(measureDataAge>=3600)&&(measureDataAge<86400)
IfTrueAction3=[!SetOption meterStaleNote Text "updated %1h ago"]
IfCondition4=(measureDataOld=1)&&(measureDataAge>=86400)
IfTrueAction4=[!SetOption meterStaleNote Text "updated %1d ago"]

; ==========================================================================
;  METERS
; ==========================================================================

; --- Shadows ---
[meterShadowOuter]
Meter=Shape
Shape=Rectangle 4,4,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,20 | StrokeWidth 0
Hidden=(1-#bgShadow#)

[meterShadowInner]
Meter=Shape
Shape=Rectangle 2,2,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,35 | StrokeWidth 0
Hidden=(1-#bgShadow#)

; --- Background ---
[meterBackground]
Meter=Shape
Shape=Rectangle 0,0,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color #bgColor# | Stroke Color #bgBorderColor# | StrokeWidth #bgBorderThickness#
Hidden=(1-#bgType#)

; --- Brand Dot (ChatGPT teal) ---
[meterBrandDot]
Meter=Shape
Shape=Ellipse (#iPadding#+3),(#iPadding#+7),3,3 | Fill Color #barChatGPTColor# | StrokeWidth 0
Hidden=(1-#ChatGPTApiConnected#)

; --- Service Name ---
[meterServiceName]
Meter=String
X=(#iPadding#+12)
Y=(#iPadding#-2)
FontFace=#barLabelFont#
FontSize=#barLabelSize#
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=ChatGPT API
Hidden=(1-#ChatGPTApiConnected#)

; --- Period Label (top-right) ---
[meterPeriodLabel]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#-2)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=#barValueSize#
FontColor=#barValueColor#
StringStyle=Normal
StringCase=Upper
AntiAlias=1
Text=#ChatGPTApiPeriodLabel#
Hidden=(1-#ChatGPTApiConnected#)

; --- Big Dollar Amount (MTD) ---
[meterMonthTotal]
Meter=String
X=#iPadding#
Y=(#iPadding#+20)
FontFace=#barLabelFont#
FontSize=10
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=$#ChatGPTApiMonthTotal#
Hidden=(1-#ChatGPTApiConnected#)

; --- Caption ---
[meterMonthCaption]
Meter=String
X=#iPadding#
Y=(#iPadding#+36)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Month to date
Hidden=(1-#ChatGPTApiConnected#)

; --- Cached / "updated N ago" note (right of the caption) ---
; Shown while measureStale=1 or measureDataOld=1
[meterStaleNote]
Meter=String
MeasureName=measureDataAgeShown
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+36)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=8
FontColor=#barStaleColor#
StringStyle=Normal
AntiAlias=1
NumOfDecimals=0
Text=cached
DynamicVariables=1
Hidden=(([measureStale]+[measureDataOld])>0?0:1)

; --- Today label/value ---
[meterTodayLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+60)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Today
Hidden=(1-#ChatGPTApiConnected#)

[meterTodayValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+60)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=$#ChatGPTApiTodayTotal#
Hidden=(1-#ChatGPTApiConnected#)

; --- Yesterday label/value ---
[meterYesterdayLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+78)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Yesterday
Hidden=(1-#ChatGPTApiConnected#)

[meterYesterdayValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+78)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=$#ChatGPTApiYesterdayTotal#
Hidden=(1-#ChatGPTApiConnected#)

; --- Not Connected state ---
[meterNotConnected]
Meter=String
X=(#barWidgetWidth#/2)
Y=(#barWidgetHeightConsumer#/2-6)
StringAlign=Center
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Visit platform.openai.com
Hidden=#ChatGPTApiConnected#
