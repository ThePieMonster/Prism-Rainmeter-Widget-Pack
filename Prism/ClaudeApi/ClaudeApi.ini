; ==========================================================================
;  Prism Claude API Cost - platform.claude.com spend tracker
;  Reads from ConsumerData.inc (written by the Chrome extension).
;
;  Display states:
;    Connected=0  -> "Not connected" (user not logged into platform.claude.com)
;    Connected=1  -> Big MTD total, with Today + Yesterday breakdown
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#bgBlur#

; --- Context Menu ---
ContextTitle=--- Prism: Style ---
ContextAction=[]
ContextTitle2=Minimal
ContextAction2=[!WriteKeyValue Variables CurrentStyle "Minimal" "#@#Settings.inc"][!Refresh *]
ContextTitle3=Glassmorphism
ContextAction3=[!WriteKeyValue Variables CurrentStyle "Glass" "#@#Settings.inc"][!Refresh *]
ContextTitle4=Cyberpunk
ContextAction4=[!WriteKeyValue Variables CurrentStyle "Cyberpunk" "#@#Settings.inc"][!Refresh *]
ContextTitle5=Material Design
ContextAction5=[!WriteKeyValue Variables CurrentStyle "Material" "#@#Settings.inc"][!Refresh *]
ContextTitle6=--- Theme ---
ContextAction6=[]
ContextTitle7=Dark Mode
ContextAction7=[!WriteKeyValue Variables CurrentTheme "Dark" "#@#Settings.inc"][!Refresh *]
ContextTitle8=Light Mode
ContextAction8=[!WriteKeyValue Variables CurrentTheme "Light" "#@#Settings.inc"][!Refresh *]
ContextTitle9=--- Data ---
ContextAction9=[]
ContextTitle10=Open Cost Dashboard
ContextAction10=["https://platform.claude.com/workspaces/default/cost"]

[Metadata]
Name=Prism Claude API Cost
Author=Prism
Information=Month-to-date API spend from platform.claude.com.
License=MIT
Version=1.0.0

; --- Includes ---
@IncludeSettings=#@#Settings.inc
@IncludeStyle=#@#Styles\#CurrentStyle#-#CurrentTheme#.inc
@IncludeConsumer=#@#ConsumerData.inc

[Variables]
iPadding=(#bgPadding#=0?10:#bgPadding#)

; ==========================================================================
;  MEASURES
; ==========================================================================

; --- Auto-refresh every 60s so @IncludeConsumer picks up fresh data ---
[measureAutoRefresh]
Measure=Calc
Formula=([measureAutoRefresh]+1)
DynamicVariables=1
IfCondition=[measureAutoRefresh]>=60
IfTrueAction=[!Refresh]

; ==========================================================================
;  METERS
; ==========================================================================

; --- Shadows ---
[meterShadowOuter]
Meter=Shape
Shape=Rectangle 4,4,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,20 | StrokeWidth 0
Hidden=(1-#bgShadow#)

[meterShadowInner]
Meter=Shape
Shape=Rectangle 2,2,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color 0,0,0,35 | StrokeWidth 0
Hidden=(1-#bgShadow#)

; --- Background ---
[meterBackground]
Meter=Shape
Shape=Rectangle 0,0,#barWidgetWidth#,#barWidgetHeightConsumer#,#bgCornerRadius# | Fill Color #bgColor# | Stroke Color #bgBorderColor# | StrokeWidth #bgBorderThickness#
Hidden=(1-#bgType#)

; --- Brand Dot (Claude orange) ---
[meterBrandDot]
Meter=Shape
Shape=Ellipse (#iPadding#+3),(#iPadding#+7),3,3 | Fill Color #barClaudeColor# | StrokeWidth 0
Hidden=(1-#ClaudeApiConnected#)

; --- Service Name ---
[meterServiceName]
Meter=String
X=(#iPadding#+12)
Y=(#iPadding#-2)
FontFace=#barLabelFont#
FontSize=#barLabelSize#
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=Claude API
Hidden=(1-#ClaudeApiConnected#)

; --- Period Label (top-right) ---
[meterPeriodLabel]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#-2)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=#barValueSize#
FontColor=#barValueColor#
StringStyle=Normal
StringCase=Upper
AntiAlias=1
Text=#ClaudeApiPeriodLabel#
Hidden=(1-#ClaudeApiConnected#)

; --- Big Dollar Amount (MTD) ---
[meterMonthTotal]
Meter=String
X=#iPadding#
Y=(#iPadding#+20)
FontFace=#barLabelFont#
FontSize=10
FontColor=#barLabelColor#
StringStyle=Normal
StringEffect=#barGlowEffect#
FontEffectColor=#barGlowColor#
AntiAlias=1
Text=$#ClaudeApiMonthTotal#
Hidden=(1-#ClaudeApiConnected#)

; --- Caption ---
[meterMonthCaption]
Meter=String
X=#iPadding#
Y=(#iPadding#+36)
FontFace=#barLabelFont#
FontSize=8
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Month to date
Hidden=(1-#ClaudeApiConnected#)

; --- Today label/value ---
[meterTodayLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+60)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Today
Hidden=(1-#ClaudeApiConnected#)

[meterTodayValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+60)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=$#ClaudeApiTodayTotal#
Hidden=(1-#ClaudeApiConnected#)

; --- Yesterday label/value ---
[meterYesterdayLabel]
Meter=String
X=#iPadding#
Y=(#iPadding#+78)
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Yesterday
Hidden=(1-#ClaudeApiConnected#)

[meterYesterdayValue]
Meter=String
X=(#barWidgetWidth#-#iPadding#)
Y=(#iPadding#+78)
StringAlign=Right
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=$#ClaudeApiYesterdayTotal#
Hidden=(1-#ClaudeApiConnected#)

; --- Not Connected state ---
[meterNotConnected]
Meter=String
X=(#barWidgetWidth#/2)
Y=(#barWidgetHeightConsumer#/2-6)
StringAlign=Center
FontFace=#barLabelFont#
FontSize=9
FontColor=#barValueColor#
StringStyle=Normal
AntiAlias=1
Text=Not connected
Hidden=#ClaudeApiConnected#
