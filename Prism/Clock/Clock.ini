; ==========================================================================
;  Prism Clock Widget
;  A multi-style digital clock with dark/light theme switching.
;  Right-click to change style or theme.
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#bgBlur#

; --- Context Menu: Style Switching ---
ContextTitle=--- Prism: Style ---
ContextAction=[]
ContextTitle2=Minimal
ContextAction2=[!WriteKeyValue Variables CurrentStyle "Minimal" "#@#Settings.inc"][!Refresh *]
ContextTitle3=Glassmorphism
ContextAction3=[!WriteKeyValue Variables CurrentStyle "Glass" "#@#Settings.inc"][!Refresh *]
ContextTitle4=Cyberpunk
ContextAction4=[!WriteKeyValue Variables CurrentStyle "Cyberpunk" "#@#Settings.inc"][!Refresh *]
ContextTitle5=Material Design
ContextAction5=[!WriteKeyValue Variables CurrentStyle "Material" "#@#Settings.inc"][!Refresh *]

; --- Context Menu: Theme Switching ---
ContextTitle6=--- Theme ---
ContextAction6=[]
ContextTitle7=Dark Mode
ContextAction7=[!WriteKeyValue Variables CurrentTheme "Dark" "#@#Settings.inc"][!Refresh *]
ContextTitle8=Light Mode
ContextAction8=[!WriteKeyValue Variables CurrentTheme "Light" "#@#Settings.inc"][!Refresh *]

[Metadata]
Name=Prism Clock
Author=Prism
Information=Digital clock with 4 switchable styles (Minimal, Glassmorphism, Cyberpunk, Material Design) and dark/light theme toggling.
License=MIT
Version=1.0.0

; --- Load Settings & Active Style ---
@IncludeSettings=#@#Settings.inc
@IncludeStyle=#@#Styles\#CurrentStyle#-#CurrentTheme#.inc

; ==========================================================================
;  MEASURES
; ==========================================================================

[measureTime]
Measure=Time
Format=%I:%M

[measureAmPm]
Measure=Time
Format=%p

[measureDayOfWeek]
Measure=Time
Format=%a

[measureDate]
Measure=Time
Format=%b %d, %Y

; ==========================================================================
;  METERS
; ==========================================================================

; --- Drop Shadow (Material style) ---
; Two offset dark rectangles behind the card for a soft shadow effect
[meterShadowOuter]
Meter=Shape
Shape=Rectangle 4,4,#bgWidth#,#bgHeight#,#bgCornerRadius# | Fill Color 0,0,0,20 | StrokeWidth 0
Hidden=(1-#bgShadow#)

[meterShadowInner]
Meter=Shape
Shape=Rectangle 2,2,#bgWidth#,#bgHeight#,#bgCornerRadius# | Fill Color 0,0,0,35 | StrokeWidth 0
Hidden=(1-#bgShadow#)

; --- Background Card ---
[meterBackground]
Meter=Shape
Shape=Rectangle 0,0,#bgWidth#,#bgHeight#,#bgCornerRadius# | Fill Color #bgColor# | Stroke Color #bgBorderColor# | StrokeWidth #bgBorderThickness#
Hidden=(1-#bgType#)

; --- Accent Bar (top of card) ---
; Visible on Material (blue) and Cyberpunk (magenta/teal)
[meterAccentTop]
Meter=Shape
Shape=Rectangle 0,0,#bgWidth#,#accentHeight#,#bgCornerRadius#,#bgCornerRadius#,0,0 | Fill Color #accentColor# | StrokeWidth 0
Hidden=(#accentHeight#=0?1:0)

; --- Time Display ---
[meterTime]
Meter=String
MeasureName=measureTime
X=#bgPadding#
Y=(#bgPadding#-8)
FontFace=#fontTime#
FontSize=#fontSize_Time#
FontColor=#colorTime#
StringStyle=#fontStyle_Time#
StringEffect=#glowEffect#
FontEffectColor=#glowColor#
AntiAlias=1
Text=%1

; --- AM/PM Indicator ---
[meterAmPm]
Meter=String
MeasureName=measureAmPm
X=5R
Y=18r
FontFace=#fontDate#
FontSize=#fontSize_AmPm#
FontColor=#colorAmPm#
StringStyle=Normal
StringEffect=#textShadowEffect#
FontEffectColor=#colorShadow#
AntiAlias=1
Text=%1

; --- Day of Week ---
[meterDay]
Meter=String
MeasureName=measureDayOfWeek
X=#bgPadding#
Y=(#bgPadding#+66)
FontFace=#fontDate#
FontSize=#fontSize_Date#
FontColor=#colorDate#
StringStyle=#fontStyle_Date#
StringCase=Upper
StringEffect=#textShadowEffect#
FontEffectColor=#colorShadow#
AntiAlias=1
Text=%1

; --- Date ---
[meterDate]
Meter=String
MeasureName=measureDate
X=6R
Y=0r
FontFace=#fontDate#
FontSize=#fontSize_Date#
FontColor=#colorDate#
StringStyle=#fontStyle_Date#
StringCase=Upper
StringEffect=#textShadowEffect#
FontEffectColor=#colorShadow#
AntiAlias=1
Text=| %1
